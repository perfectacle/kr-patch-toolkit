name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs are superseded by newer pushes; main runs always finish.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 0.13.5
          enable-cache: true

      # xdelta3: the xdelta make test is skipped without it
      - name: Install Lua 5.4 and xdelta3
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 xdelta3

      - name: Check Lua syntax
        run: find src/kr_patch/sfc/lua src/kr_patch/fc/lua -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - run: uv sync --locked

      - run: uv run --frozen pytest -q

      - name: Build and install the wheel in a clean venv
        run: |
          uv build --wheel --out-dir dist
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install -p "$RUNNER_TEMP/wheel-venv" dist/*.whl
          krpatch="$RUNNER_TEMP/wheel-venv/bin/krpatch"
          "$krpatch" --version
          "$krpatch" audio --help
          test -f "$("$krpatch" sfc lua)/lib.lua"
          test -f "$("$krpatch" fc lua)/probe/cover.lua"

  lint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The agent guide is Korean only; every other document is a README.md / README.ko.md style pair.
      - name: English and Korean documents come in pairs
        run: |
          missing=0
          while IFS= read -r f; do
            case "$f" in
              *.ko.md) other="${f%.ko.md}.md" ;;
              *) other="${f%.md}.ko.md" ;;
            esac
            if [ ! -f "$other" ]; then
              echo "::error file=$f::$other is missing"
              missing=1
            fi
          done < <(git ls-files -- '*.md' ':!:AGENTS.md' ':!:CLAUDE.md' ':!:.agents/**')
          exit "$missing"

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 0.13.5
          enable-cache: true

      - run: uv sync --locked --only-dev

      - run: uv run --frozen --no-sync ruff check --output-format github .

  # Only what a user installs (runtime dependencies), against today's advisories.
  audit:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 0.13.5
          enable-cache: true

      - run: uv sync --locked --only-dev

      - run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/runtime.txt"
          uv run --frozen --no-sync pip-audit --strict --disable-pip -r "$RUNNER_TEMP/runtime.txt"

  actionlint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    env:
      # One place for the version: the cache key and the run both read it, and Renovate updates it.
      ZIZMOR: zizmor==1.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: python
        run: |
          {
            echo "version=$(python3 --version | cut -d ' ' -f 2)"
            echo "pipx=$(pipx --version)"
            echo "venvs=$(pipx environment --value PIPX_VENV_CACHEDIR)"
            echo "pip=$(python3 -m pip cache dir)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.python.outputs.venvs }}
            ${{ steps.python.outputs.pip }}
          key: zizmor-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.python.outputs.version }}-pipx-${{ steps.python.outputs.pipx }}-${{ env.ZIZMOR }}

      # Pin the interpreter too: pipx's run cache includes its Python path.
      - run: pipx run --python "$(command -v python3)" "$ZIZMOR" --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  # The one required status check on main: passes only when every job above passed.
  ci-ok:
    if: always()
    needs: [test, lint, audit, actionlint, zizmor]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
