[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kr-patch-toolkit"
version = "0.7.0"
description = "Game-independent tools for translation patches: IPS and xdelta patches, LZSS and LZ10/LZ11 codecs, screenshot comparison, glyph tools, seamless music loops from recordings, SFC mappers, 65c816 disassembler, tile rendering and a libretro test harness, FC iNES headers and 6502 disassembler, and NDS ROM unpacking and rebuilding."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "perfectacle" }]
requires-python = ">=3.15"
# numpy 2.5.2 is the first release with Python 3.15 wheels
dependencies = ["Pillow>=9", "numpy>=2.5.2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Software Development :: Disassemblers",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
krpatch = "kr_patch.cli:main"

[project.urls]
Homepage = "https://github.com/perfectacle/kr-patch-toolkit"

[tool.hatch.build.targets.wheel]
packages = ["src/kr_patch"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "README.ko.md", "CHANGELOG.md", "CHANGELOG.ko.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.17", "pip-audit>=2.9"]

[tool.uv]
# Supply-chain cooldown: resolve only releases at least a week old.
exclude-newer = "7 days"

[tool.ruff.lint]
# Explicit so a ruff update that widens the default rule set does not fail CI on its own.
# Bug-finding rules only: the code keeps short statements on one line on purpose.
select = ["E4", "E9", "F", "B", "I"]
# zip(strict=True) would turn a silent truncation into an exception, a behaviour change.
ignore = ["B905"]
